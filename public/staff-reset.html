<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Reset your sign-in · 360 Peptides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/store.css?v=1793405000">
<link rel="icon" href="/admin-icon-192.png">
<meta name="theme-color" content="#0b4d96">
<style>
body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 1rem;
  background: radial-gradient(40rem 30rem at 70% 30%, rgba(150,214,248,.35), rgba(11,77,150,0) 60%), linear-gradient(120deg, #07173a, #0b4d96); }
.pinbox { width: min(26rem, 100%); display: grid; gap: 1rem; justify-items: center; padding: 2rem 1.5rem 1.6rem; background: var(--card); border-radius: var(--radius); box-shadow: 0 30px 60px -30px rgba(0,0,0,.6); }
.pinbox h1 { font: 700 1.8rem/1 var(--display); text-transform: uppercase; letter-spacing: .02em; text-align: center; }
.pinbox p { color: var(--ink-2); font-size: .9rem; text-align: center; max-width: 34ch; }
.pinbox form { display: grid; gap: .8rem; width: 100%; }
.pinbox .field input.pin { font: 600 1.3rem/1 var(--mono); letter-spacing: .3em; }
.msg { min-height: 1.2rem; color: #9b1c1c; font-size: .85rem; font-weight: 500; text-align: center; }
.msg.ok { color: #176b3a; }
.rules { font-size: .8rem; color: var(--ink-2); text-align: center; margin: -.2rem 0 0; }
.btn.solid { height: 3rem; font-weight: 600; }
</style>
</head>
<body>
<div class="pinbox" id="box">
  <img class="brandimg big" src="/site-logo" alt="360 Peptides">
  <h1 id="h">One moment…</h1>
  <p id="p">Checking your link.</p>
  <form id="f" autocomplete="off" hidden>
    <div class="field"><label class="eyebrow" for="pw">New password</label><input id="pw" type="password" autocomplete="new-password" placeholder="8 or more characters"></div>
    <div class="field"><label class="eyebrow" for="pw2">Type it again</label><input id="pw2" type="password" autocomplete="new-password"></div>
    <div class="field"><label class="eyebrow" for="pin" id="pinLabel">New PIN (optional)</label><input class="pin" id="pin" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="4 to 10 digits"></div>
    <p class="rules" id="rules">The PIN signs you in by name on both apps. Leave it blank to keep the one you have.</p>
    <div class="msg" id="msg" role="alert"></div>
    <button class="btn solid wide" type="submit" id="go">Save and sign in</button>
  </form>
  <a class="btn wide" id="toApp" href="/admin" hidden style="display:inline-grid;place-items:center;text-decoration:none;height:2.8rem;font-weight:600">Go to the sign-in</a>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id), k = new URLSearchParams(location.search).get("k") || "";
  let info = null;
  const gone = (why) => { $("h").textContent = "This link has expired"; $("p").textContent = why || "Links work for 1 hour and only once. Use \"Forgot?\" on the sign-in screen to get a new one."; $("f").hidden = true; $("toApp").hidden = false; };
  if (!k) return gone();
  fetch("/api/staff/reset?k=" + encodeURIComponent(k), { credentials: "same-origin" }).then(async (r) => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return gone(j.error);
    info = j;
    $("h").textContent = "Reset your sign-in";
    $("p").textContent = `Hi ${(j.name || "").trim().split(/\s+/)[0] || "there"} — choose a new password for ${j.email}. It works on the store${j.apps && j.apps.tracker ? " and the 360 Medical Portal" : ""}.`;
    if (j.pinSet) $("rules").textContent = "The PIN signs you in by name on both apps. Leave it blank to keep the one you have."; else { $("pinLabel").textContent = "PIN (optional)"; $("rules").textContent = "A PIN lets you sign in by name on both apps without typing a password."; }
    $("f").hidden = false; $("pw").focus();
  }).catch(() => gone("We couldn't check your link. Make sure you're online and try again."));
  let busy = false;
  $("f").onsubmit = async (e) => {
    e.preventDefault(); if (busy) return;
    const pw = $("pw").value, pw2 = $("pw2").value, pin = $("pin").value.replace(/\D/g, ""), msg = $("msg");
    msg.className = "msg"; msg.textContent = "";
    if (pw.length < 8) { msg.textContent = "Use a password of at least 8 characters."; $("pw").focus(); return; }
    if (pw !== pw2) { msg.textContent = "The two passwords don't match."; $("pw2").focus(); return; }
    if ($("pin").value.trim() && !/^\d{4,10}$/.test(pin)) { msg.textContent = "A PIN is 4 to 10 digits."; $("pin").focus(); return; }
    busy = true; $("go").disabled = true;
    try {
      const r = await fetch("/api/staff/reset", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ k, password: pw, pin }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { if (r.status === 410) return gone(j.error); msg.textContent = j.error || "That didn't work. Try again."; busy = false; $("go").disabled = false; return; }
      msg.className = "msg ok"; msg.textContent = j.to.startsWith("http") ? "Saved. Taking you to the portal sign-in…" : "Saved — you're signed in. Taking you in…";
      setTimeout(() => location.replace(j.to), 900);
    } catch (x) { msg.textContent = "We couldn't reach the store. Check your connection and try again."; busy = false; $("go").disabled = false; }
  };
})();
</script>
</body>
</html>

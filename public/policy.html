<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Policies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/store.css?v=1793122447">
<style>
.pol { display: grid; grid-template-columns: 14rem minmax(0, 1fr); gap: 2rem; padding-block: 2rem 4rem; align-items: start; }
.pol nav { position: sticky; top: 5rem; display: grid; gap: .2rem; }
.pol nav a { padding: .5rem .8rem; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 500; }
.pol nav a:hover, .pol nav a.on { background: var(--card); color: var(--blue); }
.pol section { display: grid; gap: .9rem; padding: clamp(1.25rem, 3vw, 2.25rem); margin-bottom: 1.25rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); scroll-margin-top: 5.5rem; }
.pol section p { max-width: 75ch; color: var(--ink-2); }
.pol section p strong { color: var(--ink); }
@media (max-width: 760px) { .pol { grid-template-columns: minmax(0, 1fr); } .pol nav { position: static; grid-auto-flow: column; overflow-x: auto; } .pol nav a { white-space: nowrap; } }
</style>
</head>
<body>
<div class="announce" id="announce" hidden></div>
<header class="top"><div class="wrap">
  <a class="logo" href="/" style="text-decoration:none"><span id="brand">360 Medical Peptides</span></a>
  <a class="btn" href="/" style="display:inline-grid;place-items:center;text-decoration:none">← Back to store</a>
</div></header>
<main class="wrap pol">
  <nav id="pnav">
    <a href="#terms">Terms of service</a><a href="#returns">Refunds and returns</a><a href="#shipping">Shipping</a>
    <a href="#privacy">Privacy</a><a href="#contact">Contact</a><a href="#disclaimer">Disclaimer</a><a href="/lab-reports">Lab reports</a>
  </nav>
  <div id="body"></div>
</main>
<footer class="foot dark"><div class="wrap"><div class="fine" id="footFine"></div><div class="frow"><span id="footCopy"></span></div></div></footer>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const para = (t) => { const m = /^([^:]{2,40}):\s+(.*)$/.exec(String(t)); return m ? `<strong>${esc(m[1])}.</strong> ${esc(m[2])}` : esc(t); };
  const { settings: S } = await (await fetch("/api/store")).json();
  const name = S.brand || "360 Medical Peptides";
  document.title = "Policies · " + name; $("brand").textContent = name;
  if (S.announcementOn && S.announcement) {
    const el = $("announce"); el.hidden = false;
    if (S.bannerScroll) { const i = `<span>${esc(S.announcement)}</span>`.repeat(6); el.classList.add("scroll"); el.innerHTML = `<div class="mq">${i}</div><div class="mq" aria-hidden="true">${i}</div>`; }
    else el.textContent = S.announcement;
  }
  const block = (id, title, items) => `<section id="${id}"><h2 class="title">${title}</h2>${(items || []).map((t) => `<p>${para(t)}</p>`).join("") || "<p>Coming soon.</p>"}</section>`;
  $("body").innerHTML = [
    block("terms", "Terms of service", S.policyTerms),
    block("returns", "Refund and returns policy", S.policyReturns),
    block("shipping", "Shipping policy", S.policyShipping),
    block("privacy", "Privacy policy", S.policyPrivacy),
    `<section id="contact"><h2 class="title">Contact</h2><p>${S.contact ? esc(S.contact) : "Contact details coming soon."}</p><p>Include your order number with any question about an order. We cannot give dosing, medical or usage advice.</p></section>`,
    block("disclaimer", "Disclaimer", S.disclaimers)
  ].join("");
  $("footFine").innerHTML = (S.footerNotice || []).map((t) => `<p>${esc(t)}</p>`).join("");
  $("footCopy").textContent = `© ${new Date().getFullYear()} ${name}`;
  const mark = () => document.querySelectorAll("#pnav a").forEach((a) => a.classList.toggle("on", a.hash === (location.hash || "#terms")));
  addEventListener("hashchange", mark); mark();
  if (location.hash) { const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
})();
</script>
</body>
</html>

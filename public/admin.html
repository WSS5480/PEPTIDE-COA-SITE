<style>
.adm { display: grid; grid-template-columns: 13.5rem minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.side { position: sticky; top: 0; height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 1rem; padding: 1.2rem 1rem; background: var(--navy); color: var(--on-navy); overflow-y: auto; }
.side .ver { display: block; margin-top: .25rem; font: 500 .72rem/1.3 var(--body); color: var(--on-hero-2); letter-spacing: 0; text-transform: none; }
.side .logo { color: var(--on-navy); }
.side .appswitch { border-color: rgba(255,255,255,.35); flex-wrap: nowrap; } .side .appswitch a, .side .appswitch button { font-size: .72rem !important; height: 2rem; padding: 0 .3rem !important; white-space: nowrap; } .side .appswitch a { background: rgba(255,255,255,.08) !important; color: #fff !important; }
.side .appswitch button.on { background: #16a34a !important; color: #fff !important; }
.side .appswitch.views a, .side .appswitch.views button { font-size: .66rem !important; padding: 0 .1rem !important; } /* the app you are in lights up green */ .side .appswitch a:hover { background: rgba(255,255,255,.18) !important; }
.side .logobox { padding: .5rem .7rem; background: #fff; border-radius: 10px; } .side .logobox img { display: block; width: 100%; height: 2.4rem; object-fit: contain; }
.side nav { display: grid; gap: .2rem; align-content: start; }
.side nav button { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: .6rem .8rem; background: none; border: 0; border-radius: 8px; color: var(--on-hero-2); font-weight: 500; text-align: left; cursor: pointer; }
.side nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
.side nav button.on { background: rgba(255,255,255,.12); color: #fff; }
.side nav .navline { margin: .5rem .4rem; border: 0; border-top: 1px solid rgba(255,255,255,.18); }
.side nav .badge { min-width: 1.4rem; padding: 0 .35rem; background: #fff; color: var(--navy); border-radius: 999px; font-size: .72rem; font-weight: 700; text-align: center; }
.side .who { font-size: .8rem; color: var(--on-hero-2); display: grid; gap: .4rem; }
.side .sref { justify-self: start; display: inline-flex; align-items: center; gap: .35rem; margin-top: -.4rem; padding: .35rem .7rem; background: none; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; color: #fff; font-size: .8rem; cursor: pointer; }
.side .sref:hover { background: rgba(255,255,255,.1); }
.side .sref-row { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: -.4rem; } .side .sref-row .sref { margin-top: 0; text-decoration: none; }
.side .who button { justify-self: start; display: inline-flex; align-items: center; gap: .3rem; padding: .35rem .7rem; background: none; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; color: #fff; font-size: .8rem; cursor: pointer; }
.pane { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.1rem; align-content: start; padding: clamp(1rem, 3vw, 2rem); min-width: 0; }
.pane > * { min-width: 0; max-width: 100%; }
.pane > header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem 1rem; }
.pane h1 { font: 700 2rem/1 var(--display); text-transform: uppercase; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .8rem; }
.kpi { padding: 1rem 1.1rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; cursor: default; }
.kpi[data-go] { cursor: pointer; } .kpi[data-go]:hover { border-color: var(--blue); }
.kpi dt { color: var(--ink-2); font: 600 .68rem/1.3 var(--body); letter-spacing: .09em; text-transform: uppercase; }
.kpi dd { margin: .2rem 0 0; font: 700 1.6rem/1.1 var(--body); font-variant-numeric: tabular-nums; }
.tbl { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: .88rem; }
/* wide tables scroll inside their own box: the header row and the first column stay locked in place,
   and the horizontal scroll bar is always at the bottom of the box instead of below the whole table */
.tblwrap { overflow: auto; max-height: calc(100dvh - 9rem); border-radius: 12px; border: 1px solid var(--line); overscroll-behavior: contain; }
.tblwrap .tbl { border: 0; border-radius: 0; overflow: visible; }
.tblwrap .tbl th { position: sticky; top: 0; z-index: 2; box-shadow: inset 0 -1px 0 var(--line); }
.tblwrap .tbl th:first-child, .tblwrap .tbl td:first-child { position: sticky; left: 0; z-index: 1; background: var(--card); box-shadow: inset -1px 0 0 var(--line); }
.tblwrap .tbl th:first-child { z-index: 3; background: var(--ground); }
.tblwrap .tbl tr.dirty td:first-child { background: #fff8e1; } .tblwrap .tbl tr.bad td:first-child { background: #fdecec; } .tblwrap .tbl tr.click:hover td:first-child { background: var(--ground); }
.tbl th { padding: .65rem .8rem; background: var(--ground); color: var(--ink-2); font: 600 .68rem/1.3 var(--body); letter-spacing: .08em; text-transform: uppercase; text-align: left; white-space: nowrap; }
.tbl td { padding: .65rem .8rem; border-top: 1px solid var(--line); vertical-align: middle; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: var(--ground); }
.tbl input, .tbl select { width: 100%; min-width: 5rem; height: 2.3rem; padding: 0 .6rem; border: 1px solid var(--line-strong); border-radius: 7px; font: inherit; background: var(--card); }
.tbl input[type=checkbox] { width: 1.1rem; height: 1.1rem; min-width: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-block; padding: .15rem .55rem; border-radius: 999px; font-size: .74rem; font-weight: 600; text-transform: capitalize; white-space: nowrap; }
.st-new { background: #fff4d6; color: #7a5300; } .st-confirmed { background: var(--blue-wash); color: var(--blue); }
.st-paid { background: #e8e3fb; color: #4a2c9c; } .st-shipped { background: var(--pass-wash); color: var(--pass); }
.st-delivered { background: #e4ece8; color: #2d4f3f; } .st-cancelled { background: #f3e1e1; color: #8a1c1c; }
.filters { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.filters input, .filters select { height: 2.5rem; padding: 0 .8rem; border: 1px solid var(--line-strong); border-radius: 8px; font: inherit; background: var(--card); }
.panel { display: grid; gap: 1rem; padding: 1.2rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.panel h2 { font: 700 1.25rem/1.1 var(--display); text-transform: uppercase; }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1.1rem; align-items: start; }
@media (max-width: 980px) { .two { grid-template-columns: minmax(0, 1fr); } }
.hist { display: grid; gap: .5rem; margin: 0; padding: 0; list-style: none; font-size: .85rem; }
.hist li { display: grid; gap: .1rem; padding-bottom: .5rem; border-bottom: 1px solid var(--line); }
.hist small { color: var(--ink-2); }
.stack { display: grid; gap: .8rem; }
.row2 { display: flex; flex-wrap: wrap; gap: .5rem; }
.muted { color: var(--ink-2); font-size: .85rem; }
.login { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: 1rem; background: linear-gradient(120deg, var(--hero-a), var(--hero-b)); }
.login form { width: min(24rem, 100%); display: grid; gap: .9rem; padding: 1.8rem; background: var(--card); border-radius: var(--radius); }
.login h1 { font: 700 1.8rem/1 var(--display); text-transform: uppercase; }
.chk { display: inline-flex; align-items: center; gap: .5rem; font-size: .9rem; }
.chk input { width: 1.1rem; height: 1.1rem; accent-color: var(--blue); }
.pdfthumb { display: inline-grid; place-items: center; width: 3rem; height: 4.2rem; border: 1px solid var(--line-strong); border-radius: 4px; background: #fdecec; color: #9b1c1c; font: 700 .72rem/1 var(--body); }
.btn.danger { border-color: #e7b4b4; color: #9b1c1c; } .btn.danger:hover { background: #fdecec; border-color: #9b1c1c; color: #9b1c1c; }
.thumbimg { width: 3rem; height: 4.2rem; object-fit: cover; object-position: top; border: 1px solid var(--line-strong); border-radius: 4px; }
.mtop { display: none; }
.vialprev { width: 12rem; height: 12rem; display: grid; place-items: center; background: radial-gradient(70% 70% at 50% 40%, #fff 0, var(--blue-wash) 100%); border: 1px solid var(--line); border-radius: 12px; }
.vialprev svg { width: auto; height: 100%; max-width: 100%; } .vialprev img { max-width: 85%; max-height: 85%; object-fit: contain; }
.colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: .6rem 1rem; }
.colors label { display: flex; align-items: center; gap: .5rem; font-size: .86rem; }
.colors input[type=color] { width: 2.4rem; height: 2rem; padding: 0; border: 1px solid var(--line-strong); border-radius: 6px; background: none; cursor: pointer; }
.cardrow { display: grid; grid-template-columns: 8rem minmax(0, 1fr) minmax(0, 2fr); gap: .6rem; align-items: end; }
@media (max-width: 760px) { .cardrow { grid-template-columns: minmax(0, 1fr); } }
/* tables with a product name column: the name gets room, the number columns stay tight */
.tbl .namecol { min-width: 14rem; max-width: 24rem; white-space: normal; overflow-wrap: normal; word-break: keep-all; hyphens: none; line-height: 1.3; font-size: .9rem; }
.tbl .namecol strong { display: block; font-weight: 600; }
.tbl.compact th, .tbl.compact td { padding: .45rem .5rem; }
.tbl.compact .btn { height: 2rem; padding: 0 .55rem; font-size: .78rem; }
.tbl .acts { display: flex; flex-wrap: wrap; gap: .3rem; max-width: 11rem; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { height: 2.4rem; padding: 0 .9rem; background: var(--card); border: 0; border-right: 1px solid var(--line-strong); font: inherit; font-weight: 600; cursor: pointer; }
.seg button:last-child { border-right: 0; } .seg button.on { background: var(--navy); color: #fff; }
.markup h2 { font-size: 1.05rem; }
.tbl th.sortable { cursor: pointer; user-select: none; } .tbl th.sortable:hover { color: var(--blue); }
.tbl tr.dirty td { background: #fff8e1; } .tbl tr.bad td { background: #fdecec; }
@media (max-width: 820px) {
  .adm { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; z-index: 40; width: 15rem; transform: translateX(-100%); transition: transform .2s; }
  .adm.menu .side { transform: none; }
  .mtop { display: flex; align-items: center; justify-content: space-between; padding: .7rem 1rem; background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 30; }
  .mtop span { display: flex; gap: .4rem; } .mtop button { background: none; border: 1px solid rgba(255,255,255,.3); border-radius: 6px; color: #fff; padding: .35rem .7rem; }
}

/* collapsible left menu (collapse.js adds the « » button) */
.navtoggle { position: absolute; top: .55rem; right: .55rem; width: 1.9rem; height: 1.9rem; display: grid; place-items: center; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.3); border-radius: 6px; color: #fff; font-size: 1.1rem; line-height: 1; cursor: pointer; z-index: 2; }
.navtoggle:hover { background: rgba(255,255,255,.2); }
@media (min-width: 821px) {
  .side { padding-top: 2.9rem; }
  body.nav-collapsed .adm { grid-template-columns: 3rem minmax(0, 1fr); }
  body.nav-collapsed .side { padding: 3.2rem .4rem 1rem; overflow: hidden; }
  body.nav-collapsed .side > :not(.navtoggle) { display: none !important; }
  body.nav-collapsed .navtoggle { right: .55rem; left: .55rem; width: auto; }
}
@media (max-width: 820px) { .navtoggle { display: none; } }
